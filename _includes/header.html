<header class="site-header">
  <div class="shell nav-shell">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Yunpeng Chu home">YUNPENG CHU</a>

    <nav class="site-nav" aria-label="Primary navigation">
      {% for item in site.data.navigation %}
        {% assign current = false %}
        {% if item.url == '/' and page.url == '/' %}{% assign current = true %}{% endif %}
        {% if item.url != '/' and page.url contains item.url %}{% assign current = true %}{% endif %}
        <a href="{{ item.url | relative_url }}"{% if current %} class="active" aria-current="page"{% endif %}>{{ item.title | upcase }}</a>
      {% endfor %}
    </nav>
  </div>
</header>
